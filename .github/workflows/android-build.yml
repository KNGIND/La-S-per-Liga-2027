name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Install Dependencies
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/push-notifications

    - name: Prepare Clean Web Directory
      run: |
        mkdir -p public_dist
        cp -r css data icons js index.html manifest.webmanifest sw.js public_dist/ 2>/dev/null || true
        cp *.png *.svg public_dist/ 2>/dev/null || true

    - name: Configure Capacitor App Name and Credentials
      run: |
        npx cap init "La Súper Liga" "com.lasuperliga.app" --web-dir=public_dist
        npx cap add android

    - name: Sync Capacitor Projects
      run: |
        npx cap sync android

    - name: Build Android Project & Set Version
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SuperLiga-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
