name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Install Dependencies
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/push-notifications

    - name: Prepare Clean Web Directory
      run: |
        mkdir -p public_dist
        cp -r css data icons js index.html manifest.webmanifest sw.js public_dist/ 2>/dev/null || true
        cp *.png *.svg public_dist/ 2>/dev/null || true

    - name: Configure Capacitor App Name and Credentials
      run: |
        npx cap init "La Súper Liga" "com.lasuperliga.app" --web-dir=public_dist
        npx cap add android

    - name: Inject Custom App Icon (icon-512.png)
      run: |
        if [ -f icon-512.png ]; then
          echo "¡Icono encontrado! Reemplazando íconos de Capacitor..."
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$size
            cp icon-512.png android/app/src/main/res/mipmap-$size/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-$size/ic_launcher_round.png
            cp icon-512.png android/app/src/main/res/mipmap-$size/ic_launcher_foreground.png
          done
        else
          echo "⚠️ ADVERTENCIA: No se encontró icon-512.png en la raíz."
        fi

    - name: Configure Firebase Services
      run: |
        if [ -f google-services.json ]; then
          cp google-services.json android/app/google-services.json
        else
          echo "google-services.json no encontrado, omitiendo Firebase"
        fi

    - name: Fix Permissions and Web Notifications
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"

        sed -i '/<\/application>/i \    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>' $MANIFEST_PATH
        mkdir -p android/app/src/main/res/xml
        echo -e '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <external-path name="external_files" path="." />\n</paths>' > android/app/src/main/res/xml/file_paths.xml

        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST_PATH
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST_PATH
        # (Se quitó el bloque que editaba MainActivity.java: buscaba la WebView con un id inválido y no hacía nada.
        #  Capacitor ya activa JavaScript y DOM storage por su cuenta.)

    - name: Sync Capacitor Projects
      run: |
        npx cap sync android

    - name: Generate Keystore for Signing (Release APK)
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/release.keystore" ]; then
          echo "Generando keystore para firma del APK..."
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -keyalg RSA -keysize 2048 -validity 10000 -alias superliga \
            -dname "CN=La Super Liga,O=Liga,C=AR" \
            -storepass "superliga2024" -keypass "superliga2024"
        else
          echo "Usando keystore existente"
        fi

    - name: Configure Gradle Signing & Version
      run: |
        cd android
        VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
        echo "Usando versionCode: $VERSION_CODE"
        
        # Crear archivo de propiedades de signing
        cat > signing.properties <<EOF
        storeFile=$GITHUB_WORKSPACE/release.keystore
        storePassword=superliga2024
        keyAlias=superliga
        keyPassword=superliga2024
        EOF
        
        # Actualizar build.gradle con versionCode dinámico y signing
        sed -i "s/versionName \"1.0\"/versionName \"2.1.0\"/g" app/build.gradle
        sed -i "/defaultConfig {/a\\        versionCode $VERSION_CODE" app/build.gradle
        
        # Agregar bloque de signing (si no existe)
        if ! grep -q "signingConfigs {" app/build.gradle; then
          sed -i '/buildTypes {/i\    signingConfigs {\n        release {\n            storeFile file('"'"'../release.keystore'"'"')\n            storePassword '"'"'superliga2024'"'"'\n            keyAlias '"'"'superliga'"'"'\n            keyPassword '"'"'superliga2024'"'"'\n        }\n    }\n' app/build.gradle
          sed -i 's/release {/release {\n            signingConfig signingConfigs.release/' app/build.gradle
        fi

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: SuperLiga-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Upload Release APK (Alternative Name)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SuperLiga-APK-v${{ github.run_number }}
        path: android/app/build/outputs/apk/release/app-release.apk
        
